name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: npm ci
      # test/global-setup.ts builds the worker (wrangler -> worker-build) once before the suite.
      - run: npx vitest run
